# ===================================================================
# SPRING KAFKA DEAD LETTER TOPIC (DLT) DEMO - CONFIGURATION PROPERTIES
# ===================================================================

# Application name identifier
spring.application.name=DeadLetterTopicApplication

# Custom configuration property: Main Kafka Topic Name
# We use this custom property in ProducerService and ConsumerService
# so we can change topic names easily in one central place.
spring.kafka.topic.name=user-events-topic

# Kafka Broker Connection Address
# Apache Kafka runs on port 9092 by default.
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group ID
# Kafka consumers belong to a consumer group. Group members share partitions.
# Having a fixed consumer group ID ensures offsets are tracked properly.
spring.kafka.consumer.group-id=user-events-consumer-group

# Consumer Auto-Offset Reset Strategy
# 'earliest': Automatically reset the offset to the earliest offset if no initial offset is present.
spring.kafka.consumer.auto-offset-reset=earliest

# ===================================================================
# SWAGGER / OPENAPI UI CONFIGURATION
# ===================================================================
# Swagger UI URL path: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
